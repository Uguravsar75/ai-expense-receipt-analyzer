services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fatura_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: fatura_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      AI_SERVICE_URL: http://ai-service:8000
      SPRING_PROFILES_ACTIVE: postgres
    depends_on:
      - postgres
      - ai-service

volumes:
  postgres_data:
