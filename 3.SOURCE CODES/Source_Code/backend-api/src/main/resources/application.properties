# ========================================
# SERVER CONFIGURATION
# ========================================
server.port=8080
server.servlet.context-path=/api

# ========================================
# DATABASE CONFIGURATION (H2 IN-MEMORY)
# ========================================
#spring.datasource.url=jdbc:postgresql://localhost:5432/fatura_db
#spring.datasource.username=fatura_user
#spring.datasource.password=test123
#spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:h2:file:./data/faturadb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ========================================
# JPA / HIBERNATE SETTINGS
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ========================================
# LOGGING
# ========================================
logging.level.root=INFO
logging.level.com.yapayzeka.backend=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# ========================================
# SWAGGER / SPRINGDOC-OPENAPI
# ========================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Dosya yükleme limitleri
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# AI servis ayarları
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.timeout=30000

# Gmail SMTP ayarları
# Ortam değişkenlerinde MAIL_USERNAME ve MAIL_PASSWORD tanımlayın
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Uygulama URL ayarları (email linklerinde kullanılır)
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
app.backend.url=${BACKEND_URL:http://localhost:8080/api}

